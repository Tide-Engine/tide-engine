# The builders' app on Fly.io: where the build service (fly.toml) makes a
# machine for each build, from the image this file builds (Dockerfile.builder).
# The app has no machine of its own, no service, no address and no secret: a
# builder asks the service for its work at the service's public address, with
# a token for that one build.
#
# It was made on a private network of its own, so a builder reaches nothing of
# the organization's other apps:
#
#   fly apps create tide-builders --network tide-builders
#
# When tide.version changes, build its image and push it, under the version's
# name, which is where the service looks for it (main.mjs):
#
#   fly deploy -c fly.builder.toml --build-only --push --image-label "tide-$(cat tide.version)"
#
# A builder's size is the service's to say (TIDE_BUILDERS_CPUS and
# TIDE_BUILDERS_MEMORY in fly.toml): 1 shared CPU and 1 GB, which is the memory
# a build has. With the engine's objects in the image, a build compiles the
# game alone: Duel takes a few seconds, in under 512 MB. It costs while it
# builds, by the second.
app = 'tide-builders'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.builder'
