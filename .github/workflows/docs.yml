# Builds the docs site (docs/, SvelteKit), with its playable web examples, and
# deploys it to Fly.io (docs/fly.toml) when it runs on dev. Other refs only
# build it, which also checks its links. It tests the editors' grammar first,
# through the Shiki the site highlights Tide with.
#
# Every run of the Build workflow runs it (build.yml's Docs job), so one
# request does both. It still runs alone when asked to, for a change to the
# docs only: gh workflow run docs.yml --ref dev.
name: Docs

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  TIDE_HIDDEN: '1'

# One at a time for a ref, whichever workflow asked: a request made while the
# site deploys waits for it, and never stops a job of a release's run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CCACHE_NODIRECT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # tools/tide-syntax/test: the grammar's scopes, on its cases and the
      # compiler's test programs.
      - name: Test the grammar
        working-directory: docs
        run: |
          npm ci
          npm run test:grammar
          npm run test:access
          npm run test:releases
          npm run test:analytics
      # Match the main Build workflow's LLVM. The runner's Clang 18 emits
      # Emscripten setjmp helpers that the browser's WASI host does not supply.
      - name: LLVM version
        run: |
          version=$(sed -nE 's/^set\(TIDE_LLVM_VERSION ([0-9.]+)\).*/\1/p' cmake/LLVM.cmake)
          test -n "$version"
          echo "LLVM_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install tools
        shell: bash
        run: |
          major=${LLVM_VERSION%%.*}
          codename=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$major main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-$major lld-$major llvm-$major ninja-build ccache
          echo "LLVM_ROOT=/usr/lib/llvm-$major" >> "$GITHUB_ENV"
          /usr/lib/llvm-$major/bin/clang --version
      - uses: actions/cache@v4
        with:
          path: build/wasi-sdk-*
          key: wasi-sdk-${{ hashFiles('cmake/wasi-toolchain.cmake') }}
      - name: Cache compiled examples
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-docs-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-docs-${{ runner.os }}-${{ runner.arch }}-

      # The Samples gallery opens full games; guide pages show smaller examples.
      - name: Build the examples
        run: |
          cmake --preset web-release -DTIDE_DOC_EXAMPLES=ON -DTIDE_PRIVATE_PROTOTYPES=ON
          cmake --build --preset web-release --target sand duel towers sumo docs_examples sample_games private_games
          mkdir -p docs/static/sand docs/static/duel docs/static/towers docs/static/sumo
          cp build/web-release/bin/sand.html docs/static/sand/index.html
          cp build/web-release/bin/duel.html docs/static/duel/index.html
          cp build/web-release/bin/towers.html docs/static/towers/index.html
          cp build/web-release/bin/sumo.html docs/static/sumo/index.html
      - name: Build the site
        working-directory: docs
        run: |
          npm run check
          npm run build
          npm run test:seo
          npm run test:access-http
          npm run test:admin-http
          npm run test:examples

      # The image takes what the build made (docs/Dockerfile). The token is
      # a deploy token for the app: fly tokens create deploy -a tide-website
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.ref == 'refs/heads/dev'
      - name: Deploy
        if: github.ref == 'refs/heads/dev'
        working-directory: docs
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
