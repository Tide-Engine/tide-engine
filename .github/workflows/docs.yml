# Builds the docs site (docs/, VitePress), with the web demo in it, and
# publishes it to GitHub Pages when run by hand on dev. Other branches only
# build it, which also checks its links.
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TIDE_HIDDEN: '1'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build
      - uses: actions/cache@v4
        with:
          path: build/wasi-sdk-*
          key: wasi-sdk-${{ hashFiles('cmake/wasi-toolchain.cmake') }}

      # The demo's page (docs/guide/demo.md) shows it at demo/.
      - name: Build the demo
        run: |
          cmake --preset web-release
          cmake --build --preset web-release --target demo
          mkdir -p docs/public/demo
          cp build/web-release/bin/demo.html docs/public/demo/index.html
      - name: Build the site
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/dev'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
