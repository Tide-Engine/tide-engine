# Builds the docs site (docs/, SvelteKit), with its playable web examples, and
# deploys it to Fly.io (docs/fly.toml) on pushes to dev. Pull requests only
# build it, which also checks its links. It tests the editors' grammar first,
# through the Shiki the site highlights Tide with.
name: Docs

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CCACHE_NODIRECT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # tools/tide-syntax/test: the grammar's scopes, on its cases and the
      # compiler's test programs.
      - name: Test the grammar
        working-directory: docs
        run: |
          npm ci
          npm run test:grammar
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: build/wasi-sdk-*
          key: wasi-sdk-${{ hashFiles('cmake/wasi-toolchain.cmake') }}
      - name: Cache compiled examples
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-docs-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-docs-${{ runner.os }}-${{ runner.arch }}-

      # The guide pages show the games and the smaller, interactive examples.
      - name: Build the examples
        run: |
          cmake --preset web-release -DTIDE_DOC_EXAMPLES=ON
          cmake --build --preset web-release --target sand duel siege sumo docs_examples
          mkdir -p docs/static/sand docs/static/duel docs/static/siege docs/static/sumo
          cp build/web-release/bin/sand.html docs/static/sand/index.html
          cp build/web-release/bin/duel.html docs/static/duel/index.html
          cp build/web-release/bin/siege.html docs/static/siege/index.html
          cp build/web-release/bin/sumo.html docs/static/sumo/index.html
      - name: Build the site
        working-directory: docs
        run: |
          npm run check
          npm run build
          npm run test:examples

      # The image takes what the build made (docs/Dockerfile). The token is
      # a deploy token for the app: fly tokens create deploy -a tide-website
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        working-directory: docs
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
