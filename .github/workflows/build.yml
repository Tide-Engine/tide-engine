# Builds, tests and publishes tide (see AGENTS.md, Packaging).
#
# It runs on every push to dev or release, on pull requests, and when asked to
# (Run workflow, or gh workflow run build.yml --ref <branch>). Every run builds
# and tests on Windows, Linux and macOS, and the branch it runs on says what's
# published once all of that passed:
# - dev: a nightly pre-release, like 0.2.0-nightly.3.
# - release: a stable release, only tagged: nothing is committed back, so a
#   stable release is `git push origin dev:release` and nobody waits for it.
# - a pull request or any other ref: nothing.
#
# A release's version comes from conventional commits (feat:, fix:), and a run
# with neither publishes nothing: semantic-release says for a stable one
# (.releaserc.json), and .github/next-nightly.mjs for a nightly, which is
# published by this workflow itself. A build that fails on any platform fails
# the run, and nothing is published: every release has every platform's
# package.
#
# Every run also builds the docs site, and on dev deploys it (docs.yml).
#
# Jobs run on fresh GitHub-hosted runners.
name: Build
run-name: ${{ github.ref_name == 'dev' && 'Nightly' || github.ref_name == 'release' && 'Stable' || 'Check' }} (${{ github.ref_name }})

on:
  push:
    branches: [dev, release]
  pull_request:
  workflow_dispatch:

# Publishing a commit whose workflows differ from the default branch needs
# TIDE_PUBLISH_TOKEN, scoped to this repo with Contents and Workflows write.
permissions:
  contents: write

env:
  TIDE_HIDDEN: '1'
  TIDE_TELEMETRY: '0'

concurrency:
  # Dev runs overlap so their build jobs can replace stale work independently
  # of an active publisher. Stable releases still finish one run at a time.
  group: build-${{ github.ref }}-${{ github.ref == 'refs/heads/dev' && github.run_id || 'serial' }}
  queue: single
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    # Share the publisher's lock: a new version sees tags from any publication
    # already in progress. Superseded builds may otherwise choose the same next tag.
    concurrency:
      group: build-publish-${{ github.ref }}
      queue: max # A stale Release must not replace a pending newer Version.
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.new_release_version || steps.nightly.outputs.version }}
      published: ${{ steps.next.outputs.new_release_published || steps.nightly.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TIDE_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Check publishing permission
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/release'
        shell: bash
        env:
          HAS_PUBLISH_TOKEN: ${{ secrets.TIDE_PUBLISH_TOKEN != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/check-publish.sh
      # semantic-release's action installs its plugins with npm.
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.1'
          check-latest: true
      - name: Test workflow helpers
        shell: bash
        run: |
          npm ci --prefix .github --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm test --prefix .github
      # A nightly's version is our own to work out: semantic-release publishes
      # nothing for a commit that isn't its branch's newest any more, which
      # dev's rarely is by the time its packages are built.
      - name: Next nightly
        id: nightly
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: node .github/next-nightly.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Next version
        id: next
        if: github.ref == 'refs/heads/release'
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.TIDE_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

  checks:
    name: Test (${{ matrix.platform }}, ${{ matrix.preset }}, ${{ matrix.shard || 1 }})
    needs: version
    strategy:
      fail-fast: false # Finish every platform to report all failures
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            preset: release
            test-jobs: 4
          - platform: windows-x64
            os: windows-2025
            preset: web-release
            test-jobs: 4
            shard: 1
          - platform: windows-x64
            os: windows-2025
            preset: web-release
            test-jobs: 4
            shard: 2
          - platform: windows-x64
            os: windows-2025
            preset: web-release
            test-jobs: 4
            shard: 3
          - platform: windows-x64
            os: windows-2025
            preset: mingw-release
            test-jobs: 4
          - platform: linux-x64
            os: ubuntu-24.04
            preset: release
            test-jobs: 4
          - platform: linux-x64
            os: ubuntu-24.04
            preset: web-release
            test-jobs: 4
            shard: 1
          - platform: linux-x64
            os: ubuntu-24.04
            preset: web-release
            test-jobs: 4
            shard: 2
          - platform: linux-x64
            os: ubuntu-24.04
            preset: web-release
            test-jobs: 4
            shard: 3
          - platform: linux-x64
            os: ubuntu-24.04
            preset: sanitize
            test-jobs: 4
          - platform: macos-arm64
            os: macos-latest
            preset: release
            test-jobs: 4
          - platform: macos-arm64
            os: macos-latest
            preset: web-release
            test-jobs: 4
            shard: 1
          - platform: macos-arm64
            os: macos-latest
            preset: web-release
            test-jobs: 4
            shard: 2
          - platform: macos-arm64
            os: macos-latest
            preset: web-release
            test-jobs: 4
            shard: 3
    uses: ./.github/workflows/check.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
      test-jobs: ${{ matrix.test-jobs }}
      shard: ${{ matrix.shard || 1 }}
      shards: ${{ matrix.preset == 'web-release' && 3 || 1 }}
      version: ${{ needs.version.outputs.version }}
      channel: ${{ github.ref_name == 'release' && 'stable' || 'nightly' }}

  packages:
    name: Package (${{ matrix.platform }})
    needs: [version, jetbrains]
    strategy:
      fail-fast: false # Finish every platform to report all failures
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            preset: package
            test-jobs: 4
          - platform: linux-x64
            os: ubuntu-24.04
            preset: package
            test-jobs: 4
          - platform: macos-arm64
            os: macos-latest
            preset: package
            test-jobs: 4
    uses: ./.github/workflows/check.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      preset: ${{ matrix.preset }}
      test-jobs: ${{ matrix.test-jobs }}
      version: ${{ needs.version.outputs.version }}
      channel: ${{ github.ref_name == 'release' && 'stable' || 'nightly' }}

  # Preserve the required Build checks. Tests and packages run independently,
  # and every check must pass before these checks or a release can pass.
  build:
    name: Build (${{ matrix.platform }})
    needs: [checks, packages]
    if: always() && (needs.checks.result != 'skipped' || needs.packages.result != 'skipped')
    strategy:
      matrix:
        platform: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test and package
        env:
          TEST_RESULT: ${{ needs.checks.result }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
        run: test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success

  # Once replacements have been saved, trim old per-commit compiler snapshots.
  # This includes Docs' compiler cache; dependency archives remain untouched.
  cache-cleanup:
    name: Clean compiler caches
    needs: [checks, packages, docs]
    if: always() && !cancelled() && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep two snapshots per cache family
        continue-on-error: true # Cache maintenance must not prevent a release.
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const url = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/cache-cleanup.mjs`);
            const { cleanupCompilerCaches } = await import(url.href);
            await cleanupCompilerCaches(github, { ...context.repo, ref: context.ref }, core.info);

  # The plugin for JetBrains IDEs (tools/tide-jetbrains), checked against
  # the oldest IDE it supports and the newest CLion.
  jetbrains:
    name: JetBrains plugin
    concurrency:
      group: build-jetbrains-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}
    needs: version
    runs-on: ubuntu-24.04
    env:
      TIDE_VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
    defaults:
      run:
        shell: bash
        working-directory: tools/tide-jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Restoring IDE archives and extracted transforms exhausted the
          # hosted runner's disk before Gradle could start. Download on demand.
          cache-disabled: true
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin buildCliInstaller verifyPlugin -PpluginVersion="$TIDE_VERSION"
          mv build/distributions/tide-*.zip build/distributions/tide-jetbrains.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tide-jetbrains
          path: tools/tide-jetbrains/build/distributions/tide-jetbrains.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1 # Only the release job reads them, and they count against the account's storage
      - uses: actions/upload-artifact@v4
        with:
          name: tide-jetbrains-installer
          path: tools/tide-jetbrains/build/cli/tide-jetbrains-installer.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Release
    concurrency:
      group: build-publish-${{ github.ref }}
      queue: max # A stale Release must not replace a pending newer Version.
      cancel-in-progress: false
    needs: [version, build, jetbrains]
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/release') && needs.version.outputs.published == 'true'
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.publish.outputs.new_release_published || steps.nightly.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TIDE_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
      # The default branch may have changed while the packages were built.
      - name: Check publishing permission
        shell: bash
        env:
          HAS_PUBLISH_TOKEN: ${{ secrets.TIDE_PUBLISH_TOKEN != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/check-publish.sh
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS && cat dist/SHA256SUMS
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.22.1'
          check-latest: true
      # A nightly: the commit's tag, the note semantic-release keeps for each
      # of its tags (which channel it's on, so a stable release still reads
      # the history rightly), and the release with what was built.
      - name: Publish (nightly)
        id: nightly
        if: github.ref == 'refs/heads/dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TIDE_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # Once this check passes, finish publishing even if another push arrives.
          # Version selection shares this job's lock and will then see our tag.
          latest=$(git ls-remote origin refs/heads/dev)
          if [ "${latest%%[[:space:]]*}" != "$GITHUB_SHA" ]; then
            echo "A newer dev commit exists; leaving publication to its build."
            exit 0
          fi
          npm ci --prefix .github --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          node .github/nightly-notes.mjs "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/tide-release-notes.md"
          tag_ref="refs/tags/$TAG"
          notes_ref="refs/notes/semantic-release-$TAG"
          # A previous attempt may have pushed either ref before it stopped.
          remote_tag=$(git ls-remote origin "$tag_ref")
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "+$tag_ref:$tag_ref"
          fi
          if git show-ref --verify --quiet "$tag_ref"; then
            if [ "$(git rev-parse "$tag_ref^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already names another commit."
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          remote_notes=$(git ls-remote origin "$notes_ref")
          if [ -n "$remote_notes" ]; then
            git fetch --no-tags origin "+$notes_ref:$notes_ref"
          fi
          git notes --ref "semantic-release-$TAG" add -f -m '{"channels":["dev"]}' "$GITHUB_SHA"
          git push --atomic origin "$tag_ref" "$notes_ref"
          assets=("dist/tide-windows-x64.zip#tide for Windows (x64)" "dist/tide-linux-x64.tar.gz#tide for Linux (x64)"
            "dist/tide-macos-arm64.tar.gz#tide for macOS (Apple Silicon)"
            "dist/tide-jetbrains.zip#Tide plugin for JetBrains IDEs" "dist/SHA256SUMS#SHA256SUMS")
          if existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets 2>/dev/null); then
            if ! jq -e '.isDraft == false and .isPrerelease == true' <<< "$existing" >/dev/null; then
              echo "::error::Release $TAG exists but is a draft or not a prerelease. Inspect it before retrying."
              exit 1
            fi
            for asset in "${assets[@]}"; do
              file=${asset%%#*}
              name=${file##*/}
              if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' <<< "$existing" >/dev/null; then
                echo "::error::Release $TAG exists but asset $name is missing or not fully uploaded. Inspect it before retrying."
                exit 1
              fi
            done
            echo "Release $TAG is already published."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$TAG" \
              --notes-file "$RUNNER_TEMP/tide-release-notes.md" "${assets[@]}"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        id: publish
        if: github.ref == 'refs/heads/release'
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.TIDE_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

  # The docs site (docs.yml): built with every run, and deployed from dev. It's
  # beside the release, not part of it: neither waits for the other, and a
  # failure of either fails the run.
  docs:
    name: Docs
    uses: ./.github/workflows/docs.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PROTOTYPES_DEPLOY_KEY: ${{ secrets.PROTOTYPES_DEPLOY_KEY }}

  # Both channels use the Tide listing: release goes to Stable (default), dev
  # to the opt-in nightly channel, after the engine release is published.
  marketplace:
    name: JetBrains Marketplace
    needs: [version, release]
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/release') && needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish
        shell: bash
        working-directory: tools/tide-jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PLUGIN_VERSION: ${{ needs.version.outputs.version }}
          PLUGIN_CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'nightly' || 'default' }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "No JETBRAINS_MARKETPLACE_TOKEN secret: not publishing to Marketplace."
            exit 0
          fi
          chmod +x gradlew
          ./gradlew publishPlugin -PpluginVersion="$PLUGIN_VERSION" -PpluginChannel="$PLUGIN_CHANNEL"
