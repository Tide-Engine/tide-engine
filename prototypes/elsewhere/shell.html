<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Elsewhere — a cozy cooperative journey through impossible gardens. Grow three living seeds and bring a shared conservatory home to bloom.">
<meta name="robots" content="noindex">
<title>Elsewhere — Impossible gardens, shared together</title>
<style>
  html, body { margin: 0; height: 100%; background: #15251b; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  #error { display:none; position:fixed; inset:0; padding:12vh 9vw; color:#f4ecd3; background:#15251b; font:18px/1.6 system-ui; }
  #error h1 { font-weight:400; font-size:44px; }
  #error a { color:#f8c876; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" aria-label="Elsewhere game. Use WASD to walk, mouse to look, E to tend, and Escape for the menu." oncontextmenu="return false"></canvas>
<div id="error" role="alert"><h1>The garden could not open.</h1><p id="reason"></p><p>Try a current desktop browser with graphics acceleration enabled, then <a href="">open the garden again</a>.</p></div>
<script>
  var Tide = {
    canvas: document.getElementById('canvas'),
    print: text => console.log(text),
    printErr: text => console.error(text),
  };
  window.addEventListener('unhandledrejection', event => {
    document.getElementById('reason').textContent = String(event.reason?.message || event.reason);
    document.getElementById('error').style.display = 'block';
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
