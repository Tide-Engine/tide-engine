<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140f0b">
<title>Inside Out controller</title>
<!--
  A phone as one player's controller for the TV page (tv.html). It joins the
  TV's controller room on the relay by its code, and sends each press and
  release as a signal; the relay passes signals to the room's host.
-->
<style>
  html, body { margin: 0; height: 100%; background: #140f0b; color: #efe5cc; font: 600 18px system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 12px 16px; text-align: center; }
  header b { color: var(--seat); }
  form { display: grid; gap: 14px; padding: 24px; align-content: center; text-align: center; }
  input { font: inherit; font-size: 34px; letter-spacing: .15em; text-align: center; text-transform: uppercase; padding: 12px;
    border-radius: 12px; border: 2px solid #5c4a37; background: #0c0907; color: #efe5cc; }
  .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pad { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 10px; padding: 10px;
    width: min(92vw, 62vh); aspect-ratio: 1; margin: auto; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 10px 18px; }
  button { border: 2px solid #5c4a37; border-radius: 14px; background: #2b221a; color: inherit; font: inherit; font-size: 20px; padding: 14px 8px; }
  button.held { background: var(--seat); color: #140f0b; }
  .pad button { font-size: 34px; }
  #amber { border-color: #d97a45; } #teal { border-color: #38877a; }
  #status { color: #9b8b72; font-size: 15px; min-height: 1.4em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>Inside Out <b id="who"></b></header>
<form id="join">
  <div>Enter the code on the TV</div>
  <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <div class="seats"><button type="submit" id="amber" value="1">Play Amber</button><button type="submit" id="teal" value="2">Play Teal</button></div>
  <div id="status"></div>
</form>
<div class="pad" id="pad" hidden>
  <span></span><button data-key="up">▲</button><span></span>
  <button data-key="left">◀</button><span></span><button data-key="right">▶</button>
  <span></span><button data-key="down">▼</button><span></span>
</div>
<div class="row" id="row" hidden>
  <button data-key="undo">Undo</button><button data-key="restart">Restart</button>
  <button data-key="menu">Menu</button><button data-key="ok">OK</button>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const relay = params.get('relay') || window.TideRelay || 'wss://relay.tide-engine.dev';
  const input = document.getElementById('code');
  const status = document.getElementById('status');
  input.value = (params.get('code') || localStorage.getItem('inside-out-pad-code') || '').toUpperCase();
  let socket = null, player = 0, joined = false;

  function connect(code) {
    status.textContent = 'Connecting...';
    socket = new WebSocket(relay);
    socket.onopen = () => socket.send(JSON.stringify({ join: code }));
    socket.onmessage = event => {
      const message = JSON.parse(event.data);
      if (message.missing) { status.textContent = 'No TV has that code. Check it and try again.'; socket.onclose = null; socket.close(); }
      if (message.joined) {
        joined = true;
        localStorage.setItem('inside-out-pad-code', code);
        // Says which player this phone is, so the TV can show it.
        socket.send(JSON.stringify({ signal: { player } }));
        document.getElementById('join').hidden = true;
        document.getElementById('pad').hidden = false;
        document.getElementById('row').hidden = false;
      }
      if (message.closed) { joined = false; status.textContent = 'The TV page closed. Enter its new code.'; showJoin(); }
    };
    // Back to the code screen if the connection drops; the TV shows a new
    // code if it reopened its room.
    socket.onclose = () => { if (joined) { joined = false; status.textContent = 'Connection lost. Enter the code again.'; showJoin(); } };
  }
  function showJoin() {
    document.getElementById('join').hidden = false;
    document.getElementById('pad').hidden = true;
    document.getElementById('row').hidden = true;
  }
  document.getElementById('join').onsubmit = event => {
    event.preventDefault();
    const code = input.value.trim().toUpperCase().replace(/[^0-9A-Z]/g, '');
    if (code.length !== 6) { status.textContent = 'The code has six letters and numbers.'; return; }
    player = Number(event.submitter && event.submitter.value) === 2 ? 2 : 1;
    document.getElementById('who').textContent = player === 1 ? 'Amber' : 'Teal';
    document.documentElement.style.setProperty('--seat', player === 1 ? '#d97a45' : '#38877a');
    connect(code);
  };

  const send = (key, down) => { if (socket && joined && socket.readyState === 1) socket.send(JSON.stringify({ signal: { player, key, down } })); };
  for (const button of document.querySelectorAll('[data-key]')) {
    const key = button.dataset.key;
    const press = event => { event.preventDefault(); if (button.classList.contains('held')) return;
      button.classList.add('held'); send(key, true); if (navigator.vibrate) navigator.vibrate(10); };
    const release = event => { event.preventDefault(); if (!button.classList.contains('held')) return;
      button.classList.remove('held'); send(key, false); };
    button.addEventListener('pointerdown', press);
    for (const type of ['pointerup', 'pointercancel', 'pointerleave']) button.addEventListener(type, release);
  }
</script>
</body>
</html>
