<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c241f">
<meta name="description" content="Rooms within rooms. Find your way out together in a recursive puzzle game for two friends.">
<title>Inside Out — rooms within rooms</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c241f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" aria-label="Inside Out cooperative puzzle game" oncontextmenu="return false"></canvas>
<script>
  var Tide = {
    canvas: document.getElementById('canvas'),
    arguments: [`--inside-out-invite-base=${new URL(location.pathname, location.origin).href}`],
    print: text => console.log(text),
    printErr: text => console.error(text),
  };
  const previewLook = new URLSearchParams(location.search).get('look');
  if (/^[1-5]$/.test(previewLook || '')) Tide.arguments.push(`--inside-out-look=${Number(previewLook) - 1}`);
</script>
{{{ SCRIPT }}}
</body>
</html>
