# Deploy from hosting/: fly deploy --ha=false
# One fixed machine and one volume. Do not scale horizontally: this first host
# owns its SQLite ledger, saves and active match routes. No provisioning API is
# available to accounts or guest WASM. See README.md before enabling prices.
app = 'tide-hosting'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = 45

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8081'
  TIDE_HOSTING_ORIGIN = 'https://console.tide-engine.dev'
  TIDE_GAMES_ORIGIN = 'https://play.tide-engine.dev'
  TIDE_HOSTING_DATA = '/data'
  TIDE_HOSTING_REGION = 'fra'
  TIDE_HOSTING_MAX_MATCHES = '2'
  TIDE_HOSTING_ACCOUNT_MATCHES = '2'
  TIDE_HOSTING_MEMORY_BYTES = '134217728'
  TIDE_HOSTING_RETENTION_DAYS = '7'
  TIDE_HOSTING_TRANSFER_BYTES = '1073741824'
  TIDE_RELAY = 'wss://relay.tide-engine.dev'
  # Amounts and usage rates use the same billing path in Stripe test/live mode.
  # GitHub/Stripe credentials are supplied through Fly secrets.
  TIDE_HOSTING_TOPUPS = '500,1000,2500'
  # Monthly subscription configuration.
  TIDE_HOSTING_MONTHLY_AMOUNT = '2000'
  TIDE_STRIPE_MONTHLY_PRICE = 'price_1UQrw7EOEguEtdxR8VTaPR66'
  TIDE_STRIPE_PORTAL_CONFIG = 'bpc_1UQrw7EOEguEtdxRj71OCIMM'
  # Integer millionths of a minor currency unit per allocated second.
  TIDE_HOSTING_SMALL_RATE = '1000'
  TIDE_HOSTING_STANDARD_RATE = '2000'
  TIDE_HOSTING_ACCEPTING = '1'

[[mounts]]
  source = 'hosting_data'
  destination = '/data'

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100
  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'
    [http_service.checks.headers]
      Host = 'console.tide-engine.dev'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
