[package]
name = "tide-bevy-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded", "async_executor"] }
bevy_tasks = { version = "=0.20.0", default-features = false, features = ["multi_threaded", "async_executor"] }

[profile.release]
opt-level = 2
debug = 1
lto = false
codegen-units = 16
incremental = false
overflow-checks = false
